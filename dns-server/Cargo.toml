[package]
name = "dns-server"
version = "0.1.0"
edition = "2024"

[lib]
name = "dns_server"
path = "src/lib.rs"

[[bin]]
name = "dns_resolver"
path = "src/main.rs"

[[bin]]
name = "doh"
path = "src/bin/doh.rs"

[dependencies]
dns-core = { path = "../dns-core" }

axum = "0.8.9"
base64 = "0.23.0"
bytes = "1.12.1"
crossbeam-channel = "0.5.16"
http = "1.4.2"
rustls = "0.23.42"
rustls-pemfile = "2.2.0"
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.53.1", features = ["full"] }
ureq = "3.3.0"
tower-http = { version = "0.7.0", features = ["cors"] }
dotenvy = "0.15.7"
