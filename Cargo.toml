[package]
name = "dns_resolver"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "dns_resolver"
path = "src/main.rs"

[[bin]]
name = "doh"
path = "src/bin/doh.rs"

[dependencies]
axum = "0.8.9"
base64 = "0.23.0"
bytes = "1.12.1"
crossbeam-channel = "0.5.16"
http = "1.4.2"
rand = "0.10.2"
rustls = "0.23.42"
rustls-pemfile = "2.2.0"
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.53.1", features = ["full"] }
ureq = "3.3.0"
